name: Daily Learning Reminder

on:
  schedule:
    - cron: '0 22 * * *'  # 매일 KST 오전 7시 (UTC 22:00)
  workflow_dispatch: # 수동 실행 가능

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send Slack reminder
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 << 'PYEOF'
          import json, subprocess, os, re
          from datetime import date, timedelta, timezone

          KST = timezone(timedelta(hours=9))
          start = date(2026, 5, 26)
          today_kst = date.today()  # UTC 22:00 실행 = KST 다음날 07:00
          # cron은 UTC 22:00에 실행되므로 KST 기준 다음날
          today_kst = today_kst + timedelta(days=1)
          day_num = (today_kst - start).days + 1
          week_num = (day_num - 1) // 7 + 1
          dow = today_kst.isoweekday()

          webhook = os.environ["SLACK_WEBHOOK_URL"]

          if day_num > 56 or day_num < 1:
              msg = "🎉 1단계 커리큘럼 완료! 수고했습니다."
              subprocess.run(["curl", "-s", "-X", "POST", "-H", "Content-type: application/json",
                  "--data", json.dumps({"text": msg}), webhook])
              exit(0)

          if dow == 6:
              time_info = "토요일 — 5~6h (오전 3h + 오후 2~3h)"
          elif dow == 7:
              time_info = "일요일 — 2~3h (오전만, 오후 휴식)"
          else:
              time_info = "평일 — 2~3h (20:00~22:30)"

          with open("LEARNING_STAGE1.md", "r") as f:
              content = f.read()

          # Day 섹션 추출
          pattern = rf"^### Day {day_num} .*?\n(.*?)(?=^### Day |\n---\n|\Z)"
          match = re.search(pattern, content, re.DOTALL | re.MULTILINE)
          if not match:
              pattern = rf"^### Day.*?{day_num}.*?\n(.*?)(?=^### Day |\n---\n|\Z)"
              match = re.search(pattern, content, re.DOTALL | re.MULTILINE)

          if not match:
              msg = f"⚠️ Day {day_num} 섹션을 찾을 수 없습니다."
              subprocess.run(["curl", "-s", "-X", "POST", "-H", "Content-type: application/json",
                  "--data", json.dumps({"text": msg}), webhook])
              exit(0)

          # 제목 추출
          title_match = re.search(rf"^### (Day {day_num} .+)$", content, re.MULTILINE)
          if not title_match:
              title_match = re.search(rf"^### (Day.*?{day_num}.+)$", content, re.MULTILINE)
          title = title_match.group(1) if title_match else f"Day {day_num}"

          section = match.group(1)

          # 할 일 추출: - [ ] 체크박스 또는 일반 - 목록 (하위 들여쓰기 제외)
          todos = re.findall(r"^- \[ \] (.+)$", section, re.MULTILINE)
          if not todos:
              todos = [m for m in re.findall(r"^- (?!\s)(.+)$", section, re.MULTILINE)
                       if not m.startswith("**") and not m.startswith("오후") and not m.startswith("블로그")]
          todos = todos[:8]
          todos_text = "\n".join(f"• {t}" for t in todos)

          # 왜 질문 추출: **왜 질문:** 패턴 또는 일반적인 질문 패턴
          whys = re.findall(r"\*\*왜 질문:\*\*\s*(.+?)(?:\n|$)", section)
          if not whys:
              whys = [m.strip() for m in re.findall(r"^\s+- (.+\?)\s*$", section, re.MULTILINE)
                      if "왜" in m or "어디" in m or "무슨" in m or "어떻게" in m]
          whys = whys[:3]
          why_text = "\n".join(f"❓ {w}" for w in whys)

          # 메시지 조립
          parts = [f"*📚 {title}*", f"⏰ {time_info} | Week {week_num}"]

          if todos_text:
              parts.append(f"\n*할 일:*\n{todos_text}")

          if why_text:
              parts.append(f"\n*오늘의 핵심 질문:*\n{why_text}")

          msg = "\n".join(parts)

          subprocess.run(["curl", "-s", "-X", "POST", "-H", "Content-type: application/json",
              "--data", json.dumps({"text": msg}), webhook])
          PYEOF
