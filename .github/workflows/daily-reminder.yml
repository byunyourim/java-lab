name: Daily Learning Reminder

on:
  schedule:
    - cron: '0 22 * * *'  # 매일 KST 오전 7시 (UTC 22:00)
  workflow_dispatch: # 수동 실행 가능

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send Slack reminder
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 << 'PYEOF'
          import json, subprocess, os
          from datetime import date

          start = date(2026, 5, 25)
          today = date.today()
          day_num = (today - start).days + 1
          week_num = (day_num - 1) // 7 + 1
          dow = today.isoweekday()

          webhook = os.environ["SLACK_WEBHOOK_URL"]

          if day_num > 56 or day_num < 1:
              msg = "🎉 1단계 커리큘럼 완료! 수고했습니다."
              subprocess.run(["curl", "-s", "-X", "POST", "-H", "Content-type: application/json",
                  "--data", json.dumps({"text": msg}), webhook])
              exit(0)

          if dow == 6:
              time_info = "토요일 — 5~6h (오전 3h + 오후 2~3h)"
          elif dow == 7:
              time_info = "일요일 — 2~3h (오전만, 오후 휴식)"
          else:
              time_info = "평일 — 2~3h (20:00~22:30)"

          with open("LEARNING_STAGE1.md", "r") as f:
              content = f.read()

          # Day 섹션 추출
          import re
          # 단일 Day (### Day 1 ...)
          pattern = rf"### Day {day_num} .*?\n(.*?)(?=### Day |\n---|\Z)"
          match = re.search(pattern, content, re.DOTALL)
          # 범위형 Day (### Day 50~51 ...)
          if not match:
              pattern = rf"### Day.*?{day_num}.*?\n(.*?)(?=### Day |\n---|\Z)"
              match = re.search(pattern, content, re.DOTALL)

          if not match:
              msg = f"⚠️ Day {day_num} 섹션을 찾을 수 없습니다."
              subprocess.run(["curl", "-s", "-X", "POST", "-H", "Content-type: application/json",
                  "--data", json.dumps({"text": msg}), webhook])
              exit(0)

          # 제목 추출
          title_match = re.search(rf"### (Day.*?{day_num}.*)", content)
          title = title_match.group(1) if title_match else f"Day {day_num}"

          section = match.group(1)

          # 할 일 추출
          todos = re.findall(r"^- \[ \] (.+)$", section, re.MULTILINE)[:8]
          todos_text = "\n".join(f"☐ {t}" for t in todos)

          # 왜 질문 추출
          whys = re.findall(r"\*\*왜 질문:\*\*\s*(.+?)(?:\n|$)", section)[:2]
          why_text = "\n".join(f"❓ {w}" for w in whys)

          msg = f"""*📚 {title}*
          ⏰ {time_info} | Week {week_num}

          *할 일:*
          {todos_text}

          *오늘의 핵심 질문:*
          {why_text}"""

          # 들여쓰기 제거
          msg = "\n".join(line.strip() for line in msg.split("\n"))

          subprocess.run(["curl", "-s", "-X", "POST", "-H", "Content-type: application/json",
              "--data", json.dumps({"text": msg}), webhook])
          PYEOF
